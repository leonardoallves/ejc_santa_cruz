<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inscricao EJC</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <section class="hero-card">
        <p id="page-eyebrow" class="eyebrow">EJC 2026</p>
        <h1 id="page-heading">Informe seu codigo para liberar a inscricao</h1>
        <p id="page-description" class="hero-text">
          Digite o codigo recebido do administrador.
        </p>

        <form id="code-form" class="stack">
          <label id="code-label" for="code">Codigo</label>
          <div class="inline-form">
            <input id="code" name="code" type="text" autocomplete="off" required />
            <button id="code-button" type="submit">Continuar</button>
          </div>
        </form>

        <div id="code-feedback" class="feedback" aria-live="polite"></div>
      </section>

      <section id="registration-card" class="form-card hidden">
        <div class="invite-summary">
          <p class="eyebrow">Formulario liberado</p>
          <h2>Conclua sua inscricao</h2>
          <p id="validated-code" class="muted"></p>
        </div>

        <form id="registration-form" class="stack">
          <div id="registration-fields" class="stack"></div>

          <div id="photo-preview-wrap" class="photo-preview hidden">
            <img id="photo-preview-image" alt="Preview da foto selecionada" />
          </div>

          <button id="registration-button" type="submit">Concluir inscricao</button>
        </form>

        <div id="registration-feedback" class="feedback" aria-live="polite"></div>
      </section>
    </main>

    <script src="/script.js"></script>
  </body>
</html>
